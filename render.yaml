services:
  # Backend (Node.js Express server)
  - type: web
    name: edunex-server
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: edunex-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ADMIN_SECRET
        generateValue: true
      - key: CLIENT_URL
        fromService:
          type: static_site
          name: edunex-client
          property: url

  # Frontend (React static site)
  - type: static_site
    name: edunex-client
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# MongoDB Database
databases:
  - name: edunex-db
    plan: free
